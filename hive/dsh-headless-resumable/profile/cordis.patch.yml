# The hive profile: the hive bundle over dsh-base, with the model, its provider
# route and that route's endpoint all read from the spawn's environment.
#
# Nothing here is defaulted. The gateway resolves the model per session from the
# mind's broker row and the adapter puts it on the spawn; a profile holding a
# house favourite is how a wrong model goes unnoticed for weeks. An unset value
# fails the boot rather than substituting one.
- id: agent-default-model
  config:
    provider: !!js process.env.DSH_PROVIDER
    model: !!js process.env.DSH_MODEL

- id: llm-pi-ai
  config:
    providers:
      hive-proxy:
        displayName: Hive inference proxy
        apiKeyEnv: HIVE_PROXY_KEY
        api: openai-completions
        baseURL: !!js process.env.DSH_PROXY_BASE_URL
        models:
          - id: !!js process.env.DSH_MODEL
            contextWindow: !!js Number(process.env.DSH_MODEL_CONTEXT_WINDOW)
