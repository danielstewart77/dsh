# The hive profile: the hive bundle over dsh-base, and nothing else.
#
# It declares no provider and no model. There is no such thing as a harness's
# model or a profile's model — a turn names one, and the agents and subagents
# inside that turn name others. The one provider every model is reached
# through, the hive inference proxy, is the harness's own fact and lives in the
# bundle; the conversation's opening model is resolved per session by the
# gateway and arrives on the spawn's environment.
