# The hive bundle patch: one-shot task mode in a conversation this process did
# not mint. Rides directly over dsh-base, like the headless bundle it is a
# sibling of, and mounts no Host, HTTP server, Web runtime or browser plugin.
#
# Two rows differ from `dsh-headless`. The runner is ours, because theirs mints
# its own session id and cannot continue one. And `compaction-basic` is off:
# it is a summarizer whose priorities we cannot inspect, and a run being
# measured for tool traffic must not have its history silently rewritten by
# something we did not write. The tool-result pruner stays on — it is model-free
# and deterministic, and stale tool results are most of the bulk in a build.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: hmr
  disabled: true

# Off until our own backend registers this seam. A run that hits the context
# ceiling is a measurement we want; a run quietly summarized by a stranger is
# not a measurement at all.
- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: resumable-headless-startup
      name: '@hive/dsh-headless-resumable/startup'

    # Reads its task and conversation identity from the startup provider.
    - id: resumable-headless-runner
      name: '@hive/dsh-headless-resumable'
      inject: [resumableHeadlessStartup]
      config:
        task: !!js ctx.resumableHeadlessStartup.task
        sessionId: !!js ctx.resumableHeadlessStartup.sessionId
        mode: !!js ctx.resumableHeadlessStartup.mode
